<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGestão X - Pro Assistant</title>
    <style>
        :root {
            --bg: #050810; --card: #101625; --accent: #00f2ff; 
            --neon: #00f2ff; --danger: #ff0055; --success: #00ffaa;
            --warning: #ffaa00; --text: #e2e8f0;
        }
        
        /* Garantindo que o app ocupe a tela toda e a barra fique embaixo */
        html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); }
        
        body { font-family: 'Inter', sans-serif; color: var(--text); display: flex; flex-direction: column; }
        
        .container { 
            max-width: 480px; 
            margin: 0 auto; 
            flex: 1; /* Ocupa o espaço disponível */
            display: flex; 
            flex-direction: column; 
            width: 100%;
        }

        .content-area { flex: 1; overflow-y: auto; padding-bottom: 20px; }

        /* Dashboard Refinado */
        .telemetry-header { padding: 30px 20px; text-align: center; background: radial-gradient(circle at top, #16213e, #050810); position: relative; }
        .odometer { font-size: 2.8rem; font-weight: 900; color: #fff; text-shadow: 0 0 15px var(--accent); margin-bottom: 5px; }
        
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .gauge-card { background: var(--card); border: 1px solid rgba(255,255,255,0.05); border-radius: 18px; padding: 15px; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .gauge-wide { grid-column: span 2; background: linear-gradient(90deg, rgba(0,210,255,0.1), transparent); border-left: 4px solid var(--accent); }
        .gauge-val { font-size: 1.6rem; font-weight: 800; color: var(--accent); display: block; }
        .gauge-lab { font-size: 10px; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }

        /* Indicadores Secundários */
        .mini-stats { display: flex; justify-content: space-around; padding: 0 15px 20px; }
        .mini-item { font-size: 11px; color: #94a3b8; display: flex; align-items: center; gap: 5px; }
        .mini-item i { color: var(--success); }

        /* Navegação Fixa no Rodapé */
        .bottom-dock { 
            background: rgba(16, 22, 37, 0.98); 
            backdrop-filter: blur(15px); 
            display: flex; 
            justify-content: space-around; 
            padding: 20px 10px; 
            border-top: 1px solid rgba(0, 242, 255, 0.2);
            padding-bottom: calc(20px + env(safe-area-inset-bottom)); /* Suporte para iPhone X+ */
        }
        
        .dock-item { color: #475569; font-size: 1.6rem; cursor: pointer; transition: 0.3s; position: relative; }
        .dock-item.active { color: var(--neon); transform: translateY(-5px); text-shadow: 0 0 10px var(--neon); }

        /* Estilos de Card de Histórico e Peças */
        .glass-card { background: var(--card); padding: 15px; border-radius: 15px; margin: 15px; border: 1px solid rgba(255,255,255,0.05); }
        .hidden { display: none; }
        input, select { background: #1e293b; border: 1px solid #334155; color: white; padding: 14px; border-radius: 12px; width: 100%; box-sizing: border-box; margin-bottom: 12px; }
        .btn-main { background: var(--accent); color: #000; border: none; padding: 15px; border-radius: 12px; font-weight: 800; width: 100%; cursor: pointer; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">
    <div class="content-area">
        
        <div id="scr-dash">
            <div class="telemetry-header">
                <div style="font-size: 12px; color: var(--accent); font-weight: bold; letter-spacing: 2px;">VW GOL 1.6 MSI</div>
                <div class="odometer" id="main-odometer">136.670</div>
                <div class="mini-stats">
                    <div class="mini-item"><i class="fas fa-thermometer-half"></i> 92°C Arrefecimento</div>
                    <div class="mini-item"><i class="fas fa-coins"></i> R$ 0,42 / km</div>
                </div>
            </div>

            <div class="dash-grid">
                <div class="gauge-card gauge-wide">
                    <span class="gauge-val" style="font-size: 2rem;">380 KM</span>
                    <span class="gauge-lab">Autonomia Estimada</span>
                </div>
                <div class="gauge-card">
                    <span class="gauge-val">45%</span>
                    <span class="gauge-lab">Combustível</span>
                </div>
                <div class="gauge-card">
                    <span class="gauge-val">12.8</span>
                    <span class="gauge-lab">Média KM/L</span>
                </div>
                <div class="gauge-card">
                    <span class="gauge-val">13.8V</span>
                    <span class="gauge-lab">Saúde Bateria</span>
                </div>
                <div class="gauge-card">
                    <span class="gauge-val">850</span>
                    <span class="gauge-lab">RPM Motor</span>
                </div>
            </div>
        </div>

        <div id="scr-history" class="hidden">
            <div class="glass-card"><h3>Histórico</h3><p>Carregando registros...</p></div>
        </div>
        <div id="scr-parts" class="hidden">
            <div class="glass-card"><h3>Sistemas</h3><p>Selecione uma categoria...</p></div>
        </div>
        <div id="scr-cart" class="hidden">
            <div class="glass-card"><h3>Sacola</h3><p>Seu carrinho está vazio.</p></div>
        </div>
        <div id="scr-settings" class="hidden">
            <div class="glass-card"><h3>Configurações</h3><button class="btn-main">Conectar OBD2</button></div>
        </div>

    </div>

    <nav class="bottom-dock">
        <div class="dock-item active" onclick="nav('dash', this)"><i class="fas fa-tachometer-alt"></i></div>
        <div class="dock-item" onclick="nav('history', this)"><i class="fas fa-history"></i></div>
        <div class="dock-item" onclick="nav('parts', this)"><i class="fas fa-tools"></i></div>
        <div class="dock-item" onclick="nav('cart', this)"><i class="fas fa-shopping-basket"></i></div>
        <div class="dock-item" onclick="nav('settings', this)"><i class="fas fa-cog"></i></div>
    </nav>
</div>

<script>
    function nav(scr, el) {
        // Esconde todas as telas dentro da área de conteúdo
        document.querySelector('.content-area').childNodes.forEach(node => {
            if(node.id && node.id.startsWith('scr-')) node.classList.add('hidden');
        });
        
        document.getElementById('scr-'+scr).classList.remove('hidden');
        
        // Atualiza ícones
        document.querySelectorAll('.dock-item').forEach(i => i.classList.remove('active'));
        el.classList.add('active');
    }
</script>

</body>
</html>
