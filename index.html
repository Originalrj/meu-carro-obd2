<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGestão X - Telemetria & Shopping</title>
    <style>
        :root {
            --bg: #0b0f19; --card: #161b2c; --accent: #00d2ff; 
            --neon: #00f2ff; --danger: #ff0055; --success: #00ffaa;
            --warning: #ffaa00; --text: #e2e8f0;
        }
        body { font-family: 'Orbitron', sans-serif; background: var(--bg); color: var(--text); margin: 0; }
        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Dashboard de Telemetria */
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; }
        .gauge-card { background: var(--card); border: 1px solid rgba(0,242,255,0.2); border-radius: 15px; padding: 15px; text-align: center; box-shadow: 0 0 15px rgba(0,0,0,0.5); }
        .gauge-value { font-size: 1.8rem; font-weight: 900; color: var(--neon); display: block; }
        .gauge-label { font-size: 10px; color: #94a3b8; text-transform: uppercase; }
        
        /* Peças e Sacola */
        .glass-card { background: var(--card); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; padding: 15px; margin-bottom: 12px; }
        .part-row { display: flex; align-items: center; justify-content: space-between; }
        .checkbox-custom { width: 22px; height: 22px; accent-color: var(--neon); }

        /* Estilo App */
        .btn-action { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; }
        .hidden { display: none; }
        .bottom-dock { background: rgba(11, 15, 25, 0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; padding: 15px; position: sticky; bottom: 0; border-top: 1px solid var(--accent); }
        .dock-item { color: #475569; font-size: 1.4rem; cursor: pointer; transition: 0.3s; }
        .dock-item.active { color: var(--neon); text-shadow: 0 0 10px var(--neon); }
        
        input, select { background: #1f2937; border: 1px solid #374151; color: white; padding: 12px; border-radius: 10px; width: 100%; margin-bottom: 10px; box-sizing: border-box; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">
    
    <div id="screen-main">
        <div style="padding: 20px; text-align: center; background: linear-gradient(to bottom, #161b2c, #0b0f19);">
            <div id="car-active-name" style="color: var(--accent); font-size: 12px;">GOL 1.6 MSI</div>
            <div style="font-size: 2.5rem; font-weight: 900; margin: 5px 0;" id="main-odometer">0 KM</div>
            <div style="font-size: 12px; color: var(--success);"><i class="fas fa-link"></i> OBD2 CONECTADO</div>
        </div>

        <div class="dash-grid">
            <div class="gauge-card"><span class="gauge-value" id="val-rpm">0</span><span class="gauge-label">RPM</span></div>
            <div class="gauge-card"><span class="gauge-value" id="val-bat">13.8V</span><span class="gauge-label">Bateria</span></div>
            <div class="gauge-card"><span class="gauge-value" id="val-fuel">75%</span><span class="gauge-label">Nível Combustível</span></div>
            <div class="gauge-card"><span class="gauge-value" id="val-range">450</span><span class="gauge-label">Autonomia (KM)</span></div>
            <div class="gauge-card" style="grid-column: span 2;"><span class="gauge-value" id="val-cons">12.5</span><span class="gauge-label">KM / Litro</span></div>
        </div>
    </div>

    <div id="screen-fuel" class="hidden" style="padding:20px">
        <h3>Registro de Combustível</h3>
        <label>Tipo de Combustível</label>
        <select id="fuel-type">
            <option>Gasolina Comum</option>
            <option>Gasolina Aditivada</option>
            <option>Álcool Comum</option>
            <option>Álcool Aditivado</option>
            <option>Diesel</option>
        </select>
        <input type="text" id="fuel-station" placeholder="Nome do Posto">
        <input type="number" id="fuel-price" placeholder="Preço por Litro">
        <button class="btn-action" onclick="alert('Abastecimento salvo!')">Registrar no Histórico</button>
    </div>

    <div id="screen-parts" class="hidden" style="padding:20px">
        <h3>Sistemas do Veículo</h3>
        <select id="part-category-select" onchange="renderCatalog()">
            <option value="Motor">Motor</option>
            <option value="Suspensão">Suspensão</option>
            <option value="Freios">Freios</option>
            <option value="Elétrica">Elétrica</option>
            <option value="Arrefecimento">Arrefecimento</option>
        </select>
        <div id="catalog-list" style="margin-top:15px"></div>
    </div>

    <div id="screen-cart" class="hidden" style="padding:20px">
        <h3>Sacola de Compras</h3>
        <div id="cart-items"></div>
        <div id="cart-summary" class="glass-card" style="border-top: 2px solid var(--success); margin-top: 20px;">
            <div style="display:flex; justify-content:space-between; font-weight:bold">
                <span>Total Estimado:</span>
                <span id="cart-total">R$ 0,00</span>
            </div>
            <button class="btn-action" style="margin-top:15px; background:var(--success)">Finalizar no Mercado Livre</button>
        </div>
    </div>

    <div id="screen-settings" class="hidden" style="padding:20px">
        <h3>Ajustes & Hardware</h3>
        <button class="btn-action" style="margin-bottom:10px" onclick="connectBluetooth()">Sincronizar OBD2</button>
        <button class="btn-action" style="background:var(--danger)">Resetar Dados do Carro</button>
    </div>

    <nav class="bottom-dock">
        <div class="dock-item active" onclick="showTab('main', this)"><i class="fas fa-tachometer-alt"></i></div>
        <div class="dock-item" onclick="showTab('fuel', this)"><i class="fas fa-gas-pump"></i></div>
        <div class="dock-item" onclick="showTab('parts', this)"><i class="fas fa-tools"></i></div>
        <div class="dock-item" onclick="showTab('cart', this)"><i class="fas fa-shopping-basket"></i></div>
        <div class="dock-item" onclick="showTab('settings', this)"><i class="fas fa-cog"></i></div>
    </nav>
</div>

<script>
// Base de Dados de Peças Expandida
const partsDB = {
    "Motor": [
        {id:'m1', name:'Óleo 5W40 100% Sintético', price:240, code:'VW508', ml:'oleo 5w40 gol msi'},
        {id:'m2', name:'Kit Filtros (Ar/Óleo/Combustível)', price:120, code:'KL404', ml:'kit filtros gol msi'},
        {id:'m3', name:'Kit Correia Dentada + Tensor', price:450, code:'04E109', ml:'kit correia msi'}
    ],
    "Suspensão": [
        {id:'s1', name:'Amortecedores Dianteiros (Par)', price:890, code:'AM12', ml:'amortecedor dianteiro gol'}
    ],
    "Freios": [
        {id:'f1', name:'Pastilhas de Freio Dianteiras', price:180, code:'PF20', ml:'pastilha freio gol'}
    ]
};

let shoppingCart = [];

function showTab(tab, el) {
    document.querySelectorAll('.container > div').forEach(d => d.classList.add('hidden'));
    document.getElementById('screen-'+tab).classList.remove('hidden');
    document.querySelectorAll('.dock-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
    if(tab === 'parts') renderCatalog();
    if(tab === 'cart') renderCart();
}

function renderCatalog() {
    const cat = document.getElementById('part-category-select').value;
    const list = document.getElementById('catalog-list');
    list.innerHTML = '';
    
    (partsDB[cat] || []).forEach(p => {
        const isInCart = shoppingCart.find(item => item.id === p.id);
        list.innerHTML += `
            <div class="glass-card part-row">
                <div>
                    <div style="font-weight:bold">${p.name}</div>
                    <div style="font-size:10px; color:var(--accent)">COD: ${p.code} | R$ ${p.price.toFixed(2)}</div>
                </div>
                <input type="checkbox" class="checkbox-custom" ${isInCart ? 'checked' : ''} onchange="toggleCart('${p.id}', '${cat}')">
            </div>`;
    });
}

function toggleCart(id, cat) {
    const part = partsDB[cat].find(p => p.id === id);
    const index = shoppingCart.findIndex(item => item.id === id);
    
    if (index > -1) {
        shoppingCart.splice(index, 1);
    } else {
        shoppingCart.push(part);
    }
}

function renderCart() {
    const list = document.getElementById('cart-items');
    list.innerHTML = '';
    let total = 0;

    // Adiciona Combo de Revisão Sugerido se a sacola estiver vazia ou como item fixo
    if(shoppingCart.length === 0) {
        list.innerHTML = '<p style="text-align:center; opacity:0.5">Sua sacola está vazia.</p>';
    }

    shoppingCart.forEach((item, index) => {
        total += item.price;
        list.innerHTML += `
            <div class="glass-card part-row" style="border-left: 4px solid var(--accent)">
                <div>
                    <div style="font-weight:bold">${item.name}</div>
                    <div style="font-size:12px; color:var(--success)">R$ ${item.price.toFixed(2)}</div>
                </div>
                <i class="fas fa-trash" style="color:var(--danger)" onclick="removeFromCart(${index})"></i>
            </div>`;
    });

    // Item de Combo (Exemplo)
    list.innerHTML += `
        <div class="glass-card" style="border: 1px solid var(--warning)">
            <div style="font-weight:bold; color:var(--warning)">📦 COMBO REVISÃO 60.000 KM</div>
            <div style="font-size:11px">Inclui Correia, Óleo e Filtros.</div>
            <div style="text-align:right; font-weight:bold">R$ 680,00</div>
        </div>`;
    
    document.getElementById('cart-total').innerText = 'R$ ' + (total + 680).toFixed(2);
}

function removeFromCart(index) {
    shoppingCart.splice(index, 1);
    renderCart();
}

// Simulação de OBD2 rodando
setInterval(() => {
    if(!document.getElementById('screen-main').classList.contains('hidden')) {
        document.getElementById('val-rpm').innerText = Math.floor(Math.random() * (900 - 850) + 850);
    }
}, 1000);

function connectBluetooth() {
    alert("Buscando adaptadores ELM327...");
}
</script>
</body>
</html>
