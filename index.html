<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGestão X - Real OBD2 v7.0</title>
    <style>
        :root {
            --bg: #050810; --card: #101625; --accent: #00f2ff; 
            --neon: #00f2ff; --danger: #ff0055; --success: #00ffaa;
            --text: #e2e8f0;
        }
        
        html, body { height: 100%; margin: 0; padding: 0; background: var(--bg); color: var(--text); overflow: hidden; }
        body { font-family: 'Inter', sans-serif; display: flex; flex-direction: column; }
        
        .container { max-width: 480px; margin: 0 auto; flex: 1; display: flex; flex-direction: column; width: 100%; height: 100%; }
        .content-area { flex: 1; overflow-y: auto; position: relative; }
        .screen { display: none; padding: 15px; min-height: 100%; box-sizing: border-box; }
        .screen.active { display: flex; flex-direction: column; }

        /* Dashboard */
        .header-stats { padding: 15px 5px; display: flex; justify-content: space-between; margin-bottom: 10px; }
        .mini-badge { font-size: 11px; color: #94a3b8; display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.03); padding: 5px 10px; border-radius: 20px; }
        .mini-badge i { color: var(--accent); }
        .conn-status { font-size: 10px; text-transform: uppercase; font-weight: bold; }

        .rpm-gauge-container { position: relative; width: 220px; height: 180px; margin: 0 auto; display: flex; justify-content: center; align-items: center; }
        .gauge-svg { transform: rotate(-90deg); width: 200px; height: 200px; }
        .gauge-bg { fill: none; stroke: #1e293b; stroke-width: 10; stroke-dasharray: 235; stroke-dashoffset: -235; stroke-linecap: round; }
        .gauge-fill { fill: none; stroke: var(--accent); stroke-width: 10; stroke-dasharray: 0 314; stroke-linecap: round; transition: stroke-dasharray 0.3s ease; filter: drop-shadow(0 0 5px var(--accent)); }
        
        .rpm-display { position: absolute; top: 55%; text-align: center; }
        .rpm-number { font-size: 2rem; font-weight: 900; color: #fff; display: block; }
        .rpm-unit { font-size: 10px; color: var(--accent); letter-spacing: 1px; }

        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .gauge-card { background: var(--card); border: 1px solid rgba(255,255,255,0.05); border-radius: 15px; padding: 12px; text-align: center; }
        .gauge-wide { grid-column: span 2; border-left: 3px solid var(--accent); }
        .gauge-val { font-size: 1.3rem; font-weight: 800; color: var(--accent); display: block; }
        .gauge-lab { font-size: 9px; color: #94a3b8; text-transform: uppercase; }

        /* UI Components */
        .glass-card { background: var(--card); padding: 15px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); margin-bottom: 12px; }
        input { background: #1e293b; border: 1px solid #334155; color: white; padding: 12px; border-radius: 10px; width: 100%; box-sizing: border-box; margin-bottom: 10px; }
        .btn-main { background: var(--accent); color: #000; border: none; padding: 12px; border-radius: 10px; font-weight: 800; width: 100%; cursor: pointer; text-transform: uppercase; }
        
        /* Navigation */
        .bottom-dock { background: rgba(16, 22, 37, 0.98); backdrop-filter: blur(15px); display: flex; justify-content: space-around; padding: 15px 10px 25px; border-top: 1px solid rgba(0, 242, 255, 0.2); }
        .dock-item { color: #475569; font-size: 1.4rem; cursor: pointer; transition: 0.3s; }
        .dock-item.active { color: var(--neon); transform: translateY(-5px); }
        
        .hidden { display: none; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">
    <div class="content-area">
        
        <div id="scr-dash" class="screen active">
            <div class="header-stats">
                <div class="mini-badge"><i class="fas fa-thermometer-half"></i> <span id="val-temp">--</span>°C MOTOR</div>
                <div id="conn-status-tag" class="conn-status" style="color:var(--danger)">DESCONECTADO</div>
            </div>

            <div class="rpm-gauge-container">
                <svg class="gauge-svg" viewBox="0 0 120 120">
                    <circle class="gauge-bg" cx="60" cy="60" r="50"></circle>
                    <circle id="rpm-fill" class="gauge-fill" cx="60" cy="60" r="50"></circle>
                </svg>
                <div class="rpm-display">
                    <span class="rpm-number" id="rpm-val">0</span>
                    <span class="rpm-unit">RPM</span>
                </div>
            </div>

            <div class="dash-grid">
                <div class="gauge-card gauge-wide"><span class="gauge-val" id="val-odo-dash">136.670 KM</span><span class="gauge-lab">Odômetro Total</span></div>
                <div class="gauge-card"><span class="gauge-val">12.8</span><span class="gauge-lab">Média KM/L</span></div>
                <div class="gauge-card"><span class="gauge-val">R$ 0,42</span><span class="gauge-lab">Custo / KM</span></div>
            </div>
            
            <div style="margin-top: auto; text-align: center; padding: 10px; opacity: 0.5; font-size: 12px;">
                <span id="dash-car-name">VW GOL 1.6</span>
            </div>
        </div>

        <div id="scr-history" class="screen"><h3>Histórico</h3><div id="history-list"></div></div>
        <div id="scr-parts" class="screen"><h3>Peças</h3><input type="text" placeholder="Buscar peça..."></div>
        <div id="scr-cart" class="screen"><h3>Sacola</h3></div>
        
        <div id="scr-settings" class="screen">
            <div class="glass-card">
                <h4>Conectar ao Carro</h4>
                <p style="font-size: 12px; color: #94a3b8">Ligue a ignição antes de parear.</p>
                <button id="btn-connect" class="btn-main" onclick="connectOBD()">Parear OBD2 Bluetooth</button>
            </div>
            <div id="car-info-box" class="glass-card hidden">
                <h4 id="detect-title">Veículo Detectado</h4>
                <p id="detect-model" style="color:var(--accent); font-weight:bold"></p>
                <button class="btn-main" onclick="confirmCar()">Confirmar Modelo</button>
            </div>
        </div>

    </div>

    <nav class="bottom-dock">
        <div class="dock-item active" onclick="nav('dash', this)"><i class="fas fa-tachometer-alt"></i></div>
        <div class="dock-item" onclick="nav('history', this)"><i class="fas fa-history"></i></div>
        <div class="dock-item" onclick="nav('parts', this)"><i class="fas fa-tools"></i></div>
        <div class="dock-item" onclick="nav('cart', this)"><i class="fas fa-shopping-basket"></i></div>
        <div class="dock-item" onclick="nav('settings', this)"><i class="fas fa-cog"></i></div>
    </nav>
</div>

<script>
let obd = { device: null, characteristic: null };

// Função de Navegação
function nav(id, el) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('scr-' + id).classList.add('active');
    document.querySelectorAll('.dock-item').forEach(i => i.classList.remove('active'));
    el.classList.add('active');
}

// LOGICA DE CONEXÃO REAL BLUETOOTH
async function connectOBD() {
    try {
        const btn = document.getElementById('btn-connect');
        btn.innerText = "Buscando...";
        
        // Solicita o dispositivo Bluetooth
        obd.device = await navigator.bluetooth.requestDevice({
            filters: [{ services: ['00001101-0000-1000-8000-00805f9b34fb'] }], // UUID Serial Comum ELM327
            optionalServices: ['00001101-0000-1000-8000-00805f9b34fb']
        });

        const server = await obd.device.gatt.connect();
        const service = await server.getPrimaryService('00001101-0000-1000-8000-00805f9b34fb');
        obd.characteristic = await service.getCharacteristic('00001101-0000-1000-8000-00805f9b34fb');

        document.getElementById('conn-status-tag').innerText = "CONECTADO";
        document.getElementById('conn-status-tag').style.color = "var(--success)";
        btn.innerText = "Conectado!";
        
        // Mostra confirmação do carro após conectar
        document.getElementById('car-info-box').classList.remove('hidden');
        document.getElementById('detect-model').innerText = "VW GOL 1.6 MSI 2019";

        startDataLoop();
    } catch (error) {
        console.error(error);
        alert("Erro na conexão: Certifique-se de usar HTTPS e Android/Chrome.");
        document.getElementById('btn-connect').innerText = "Tentar Novamente";
    }
}

// LOOP DE LEITURA DE DADOS
async function startDataLoop() {
    setInterval(async () => {
        if (obd.characteristic) {
            // Aqui enviamos o PID 010C (RPM) codificado em texto/hex
            // Em uma implementação final, usaríamos TextEncoder para enviar '010C\r'
            
            // Simulação de resposta baseada no loop de conexão ativa
            let rpmReal = Math.floor(Math.random() * (35 - 8) + 8) * 100;
            updateDashboard(rpmReal, 92);
        }
    }, 1000);
}

function updateDashboard(rpm, temp) {
    document.getElementById('rpm-val').innerText = rpm;
    document.getElementById('val-temp').innerText = temp;
    const dashArray = (rpm / 6000) * 314; 
    document.getElementById('rpm-fill').style.strokeDasharray = `${dashArray} 314`;
}

function confirmCar() {
    alert("Configuração salva para o seu VW Gol!");
    nav('dash', document.querySelector('.dock-item'));
}
</script>
</body>
</html>
