<div id="scr-history" class="hidden" style="padding: 20px;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 20px;">
            <h3 style="margin:0">Histórico de Vida</h3>
            <button class="btn-main" style="width:auto; padding:8px 15px; font-size:12px" onclick="openHistoryModal()">+ Adicionar</button>
        </div>

        <div id="history-form" class="glass-card hidden" style="border:1px solid var(--accent); margin-bottom:20px">
            <h4 style="margin-top:0">Nova Manutenção</h4>
            <select id="hist-part-name">
                <option value="Óleo e Filtro">Óleo e Filtro</option>
                <option value="Correia Dentada">Correia Dentada</option>
                <option value="Pastilhas de Freio">Pastilhas de Freio</option>
                <option value="Pneus">Pneus</option>
                <option value="Outro">Outro (Geral)</option>
            </select>
            <input type="number" id="hist-km" placeholder="KM que foi trocado">
            <input type="date" id="hist-date">
            <div style="display:flex; gap:10px">
                <button class="btn-main" onclick="saveHistory()">Salvar</button>
                <button class="btn-main btn-outline" onclick="openHistoryModal()">Cancelar</button>
            </div>
        </div>

        <div id="history-timeline">
            <div id="empty-history" style="text-align:center; color:#64748b; margin-top:40px">
                <i class="fas fa-tools" style="font-size:3rem; margin-bottom:10px"></i>
                <p>Nenhuma manutenção registrada.<br>Adicione o que você já fez no carro!</p>
            </div>
        </div>
    </div>
