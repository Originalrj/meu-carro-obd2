<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGestão Master Pro - OBD2 Ready</title>
    <style>
        :root {
            --primary: #2c3e50; --accent: #3498db; --danger: #e74c3c;
            --success: #2ecc71; --warning: #f1c40f; --bg: #f4f7f6;
            --ml-yellow: #fff159;
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); margin: 0; padding: 10px; color: #333; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); min-height: 90vh; position: relative; }
        
        /* Telas */
        .hidden { display: none; }
        .home-screen { text-align: center; }
        
        /* Componentes Visuais */
        .car-img { width: 100%; border-radius: 12px; margin: 15px 0; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .km-badge { background: var(--primary); color: white; padding: 8px 20px; border-radius: 30px; font-size: 1.2rem; font-weight: bold; display: inline-block; margin: 10px 0; }
        
        /* Botões */
        button, .main-nav-btn { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .main-nav-btn { background: var(--primary); color: white; }
        .btn-accent { background: var(--accent); color: white; }
        .btn-success { background: var(--success); color: white; }
        .btn-ml { background: var(--ml-yellow); color: #333; text-decoration: none; display: block; text-align: center; font-size: 14px; padding: 10px; border-radius: 8px; }
        
        /* Navegação e Abas */
        .nav-tabs { display: flex; gap: 5px; margin-bottom: 20px; background: #eee; padding: 5px; border-radius: 10px; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: none; font-weight: bold; cursor: pointer; color: #666; font-size: 13px; }
        .tab-btn.active { background: white; border-radius: 8px; color: var(--accent); box-shadow: 0 2px 5px rgba(0,0,0,0.1); }

        /* Cards */
        .card { border: 1px solid #eee; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 6px solid var(--accent); background: #fff; }
        .card.vencido { border-left-color: var(--danger); background: #fff5f5; }
        .filter-group { margin-bottom: 20px; padding: 10px; background: #f9f9f9; border-radius: 8px; }
        
        input, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        .status-msg { font-size: 12px; color: var(--accent); font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup-screen" class="hidden">
        <h2 style="text-align:center">Novo Veículo</h2>
        <input type="text" id="vin-input" placeholder="Digite o Chassi (VIN)" maxlength="17" oninput="decodificarVIN()" style="border: 2px solid var(--accent)">
        <div id="auto-info" class="status-msg" style="text-align: center;"></div>
        
        <select id="marca" onchange="popularModelos()">
            <option value="">Selecione a Marca</option>
            <option value="volkswagen">Volkswagen</option>
            <option value="fiat">Fiat</option>
            <option value="chevrolet">Chevrolet</option>
        </select>
        <select id="modelo"><option value="">Selecione o Modelo</option></select>
        <input type="number" id="km-inicial" placeholder="Quilometragem Atual">
        <button class="btn-accent" onclick="iniciarApp()">Salvar Configuração</button>
    </div>

    <div id="home-screen" class="hidden">
        <h1 id="home-car-title" style="margin-bottom:0">Meu Carro</h1>
        <img id="car-img-home" src="https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?w=500" class="car-img" alt="Foto do Carro">
        <div class="km-badge" id="home-km-display">0 KM</div>
        
        <button class="main-nav-btn" onclick="switchTab('dash')">⚙️ Painel de Manutenção</button>
        <button class="main-nav-btn" style="background:var(--accent)" onclick="switchTab('hist')">📜 Histórico de Serviços</button>
        <button class="main-nav-btn" style="background:#27ae60" onclick="switchTab('pecas')">📦 Catálogo de Peças</button>
        
        <hr>
        <button id="btn-scan" style="background: #6200ea; color: white;">🔍 Scan OBD2 (Bluetooth)</button>
        <div id="status-bluetooth" class="status-msg" style="text-align:center"></div>
    </div>

    <div id="main-app" class="hidden">
        <button onclick="mostrarHome()" style="background:none; color:var(--primary); border:none; font-weight:bold; cursor:pointer; width: auto;">← Voltar Home</button>
        
        <div style="text-align: center;">
            <div class="km-badge" id="app-km-display">0 KM</div>
            <div style="display:flex; gap:5px; margin-bottom: 20px;">
                <input type="number" id="new-km" placeholder="Atualizar KM...">
                <button onclick="atualizarKM()" style="width:80px; margin: 8px 0;" class="btn-accent">OK</button>
            </div>
        </div>

        <nav class="nav-tabs">
            <button class="tab-btn" id="btn-tab-dash" onclick="switchTab('dash')">Painel</button>
            <button class="tab-btn" id="btn-tab-hist" onclick="switchTab('hist')">Histórico</button>
            <button class="tab-btn" id="btn-tab-pecas" onclick="switchTab('pecas')">Peças</button>
        </nav>

        <div id="tab-dash" class="tab-content">
            <div id="lista-manutencao"></div>
        </div>

        <div id="tab-hist" class="tab-content hidden">
            <h3>Linha do Tempo</h3>
            <div id="lista-historico"></div>
        </div>

        <div id="tab-pecas" class="tab-content hidden">
            <div class="filter-group">
                <label style="font-size:12px; font-weight:bold;">Filtrar Sistema:</label>
                <select id="filtro-categoria" onchange="renderPecas()">
                    <option value="Todos">Todos</option>
                    <option value="Motor">Motor</option>
                    <option value="Manutenção">Manutenção</option>
                    <option value="Lataria">Lataria</option>
                    <option value="Suspensão">Suspensão</option>
                </select>
            </div>
            <div id="catalogo-pecas"></div>
        </div>

        <button style="background:#bdc3c7; margin-top:30px; font-size:10px" onclick="resetar()">Reiniciar Aplicativo</button>
    </div>
</div>

<script>
// BANCO DE DADOS EXPANDIDO
const db = {
    "volkswagen": {
        "Gol 1.6 MSI": [
            { cat: "Manutenção", item: "Óleo 5W40 + Filtro", km: 10000, cod: "VW 508.88", ml: "oleo 5w40 vw 508 gol msi" },
            { cat: "Motor", item: "Correia Dentada", km: 60000, cod: "04E109119C", ml: "kit correia dentada gol msi 2019" },
            { cat: "Suspensão", item: "Amortecedor Dianteiro", km: 60000, cod: "Cofap GP32479", ml: "amortecedor dianteiro gol msi" },
            { cat: "Lataria", item: "Parachoque Dianteiro", cod: "5U0807217", ml: "parachoque dianteiro gol g7" }
        ],
        "Polo 1.0 TSI": [
            { cat: "Manutenção", item: "Óleo 0W20", km: 10000, cod: "VW 508", ml: "oleo 0w20 polo tsi" }
        ]
    },
    "fiat": {
        "Argo 1.3": [
            { cat: "Motor", item: "Velas de Ignição", km: 40000, cod: "NGK", ml: "vela ignicao argo 1.3" }
        ]
    }
};

let appData = JSON.parse(localStorage.getItem('auto_master_v5')) || null;

// FUNÇÕES DE IDENTIFICAÇÃO E SETUP
function decodificarVIN() {
    const v = document.getElementById('vin-input').value.toUpperCase();
    const info = document.getElementById('auto-info');
    if(v.startsWith("9BW")) {
        document.getElementById('marca').value = "volkswagen";
        popularModelos();
        info.innerText = "VW Detectado | " + (v.charAt(9) === 'K' ? 'Ano 2019' : 'Ano Identificado');
    }
}

function popularModelos() {
    const m = document.getElementById('marca').value;
    const s = document.getElementById('modelo');
    s.innerHTML = '<option value="">Selecione o Modelo</option>';
    if(db[m]) Object.keys(db[m]).forEach(mod => s.innerHTML += `<option value="${mod}">${mod}</option>`);
}

function iniciarApp() {
    const m = document.getElementById('marca').value;
    const mod = document.getElementById('modelo').value;
    const km = parseInt(document.getElementById('km-inicial').value);
    if(!m || !mod || isNaN(km)) return alert("Preencha tudo!");
    
    // Histórico base
    const hist = db[m][mod].map(p => ({ id: Math.random(), item: p.item, km: km, data: new Date().toLocaleDateString() }));
    appData = { marca: m, modelo: mod, kmAtual: km, historico: hist };
    salvar();
    mostrarHome();
}

// NAVEGAÇÃO
function mostrarHome() {
    document.getElementById('setup-screen').classList.add('hidden');
    document.getElementById('main-app').classList.add('hidden');
    document.getElementById('home-screen').classList.remove('hidden');
    document.getElementById('home-car-title').innerText = appData.modelo;
    document.getElementById('home-km-display').innerText = appData.kmAtual.toLocaleString() + " KM";
}

function switchTab(tab) {
    document.getElementById('home-screen').classList.add('hidden');
    document.getElementById('main-app').classList.remove('hidden');
    document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.remove('hidden');
    document.getElementById('btn-tab-' + tab).classList.add('active');
    
    if(tab === 'dash') renderDashboard();
    if(tab === 'hist') renderHistorico();
    if(tab === 'pecas') renderPecas();
}

// RENDERIZAÇÃO DE CONTEÚDO
function renderDashboard() {
    document.getElementById('app-km-display').innerText = appData.kmAtual.toLocaleString() + " KM";
    const lista = document.getElementById('lista-manutencao');
    lista.innerHTML = '';
    db[appData.marca][appData.modelo].forEach(p => {
        if(!p.km) return;
        const ult = appData.historico.filter(h => h.item === p.item).sort((a,b) => b.km - a.km)[0];
        const falta = (ult.km + p.km) - appData.kmAtual;
        lista.innerHTML += `
            <div class="card ${falta <= 500 ? 'vencido' : ''}">
                <small>${p.cat}</small><br>
                <b>${p.item}</b><br>
                Faltam: <span style="font-weight:bold">${falta.toLocaleString()} KM</span>
                <button class="btn-success" onclick="registrarTroca('${p.item}')" style="padding:5px; font-size:12px;">Registrar Troca</button>
            </div>`;
    });
}

function renderHistorico() {
    const container = document.getElementById('lista-historico');
    container.innerHTML = '';
    appData.historico.slice().reverse().forEach(h => {
        const pecaRef = db[appData.marca][appData.modelo].find(p => p.item === h.item);
        const linkML = `https://lista.mercadolivre.com.br/${pecaRef ? pecaRef.ml : h.item}`;
        container.innerHTML += `
            <div class="card" style="border-left-color:var(--success)">
                <b>${h.item}</b><br>
                <small>Em ${h.km.toLocaleString()} KM | ${h.data}</small>
                <a href="${linkML}" target="_blank" class="btn-ml" style="margin-top:10px">🔍 Peça no Mercado Livre</a>
            </div>`;
    });
}

function renderPecas() {
    const filtro = document.getElementById('filtro-categoria').value;
    const container = document.getElementById('catalogo-pecas');
    container.innerHTML = '';
    const pecas = db[appData.marca][appData.modelo];
    const filtradas = filtro === "Todos" ? pecas : pecas.filter(p => p.cat === filtro);
    
    filtradas.forEach(p => {
        container.innerHTML += `
            <div class="card">
                <b>${p.item}</b><br>
                <small>Código: ${p.cod || 'N/A'}</small>
                <a href="https://lista.mercadolivre.com.br/${p.ml}" target="_blank" class="btn-ml" style="margin-top:10px">🛒 Ver Preço</a>
            </div>`;
    });
}

// LÓGICA DE DADOS E BLUETOOTH
function atualizarKM() {
    const n = parseInt(document.getElementById('new-km').value);
    if(n >= appData.kmAtual) { appData.kmAtual = n; salvar(); renderDashboard(); document.getElementById('new-km').value = ''; }
}

function registrarTroca(item) {
    if(confirm("Confirmar troca de " + item + "?")) {
        appData.historico.push({ id: Math.random(), item: item, km: appData.kmAtual, data: new Date().toLocaleDateString() });
        salvar(); renderDashboard();
    }
}

function salvar() { localStorage.setItem('auto_master_v5', JSON.stringify(appData)); }
function resetar() { if(confirm("Apagar tudo?")) { localStorage.clear(); location.reload(); } }

// TESTE BLUETOOTH (OBD2)
document.getElementById('btn-scan').addEventListener('click', async () => {
    const status = document.getElementById('status-bluetooth');
    try {
        status.innerText = "Buscando ELM327...";
        const device = await navigator.bluetooth.requestDevice({ acceptAllDevices: true });
        status.innerText = "Pareado com: " + device.name;
    } catch (e) { status.innerText = "Erro: " + e.message; }
});

if(!appData) document.getElementById('setup-screen').classList.remove('hidden');
else mostrarHome();
</script>
</body>
</html>
