<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoGestão X - Futurista</title>
    <style>
        :root {
            --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; 
            --neon: #22d3ee; --danger: #f43f5e; --success: #10b981;
            --text: #f1f5f9;
        }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; overflow-x: hidden; }
        .container { max-width: 480px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }
        
        /* Layout Futurista */
        .glass-card { background: var(--card); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; margin-bottom: 15px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        .neon-border { border-left: 4px solid var(--neon); }
        .btn-futuristic { background: linear-gradient(135deg, var(--accent), #1d4ed8); color: white; border: none; padding: 15px; border-radius: 15px; font-weight: 800; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; width: 100%; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); }
        
        /* KM e Header */
        .header-main { padding: 30px 20px; background: linear-gradient(to bottom, #1e293b, #0f172a); text-align: center; border-radius: 0 0 30px 30px; }
        .km-badge-large { font-size: 2.5rem; font-weight: 900; text-shadow: 0 0 20px var(--neon); margin: 10px 0; }

        /* Navegação Estilo Dock */
        .bottom-dock { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 15px; position: sticky; bottom: 0; border-top: 1px solid rgba(255,255,255,0.1); }
        .dock-item { color: #94a3b8; font-size: 1.5rem; cursor: pointer; transition: 0.3s; }
        .dock-item.active { color: var(--neon); transform: translateY(-5px); }

        /* Peças e Catálogo */
        .progress-container { height: 6px; background: #334155; border-radius: 10px; margin: 10px 0; }
        .progress-fill { height: 100%; border-radius: 10px; box-shadow: 0 0 10px var(--neon); }
        
        select, input { background: #334155; border: 1px solid #475569; color: white; padding: 12px; border-radius: 12px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
        .hidden { display: none; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">
    
    <div id="screen-selector" class="content p-20">
        <h1 style="text-align:center">Garagem <span style="color:var(--neon)">X</span></h1>
        <div id="car-list">
            </div>
        <button class="btn-futuristic" onclick="showScreen('screen-setup')">+ Novo Veículo</button>
    </div>

    <div id="screen-setup" class="hidden p-20">
        <button onclick="showScreen('screen-selector')" style="color:var(--accent); background:none; border:none; cursor:pointer"><i class="fas fa-arrow-left"></i> Voltar</button>
        <h2>Configurar Veículo</h2>
        <select id="marca" onchange="loadModels()">
            <option value="">Marca</option>
            <option value="volkswagen">Volkswagen</option>
            <option value="fiat">Fiat</option>
            <option value="chevrolet">Chevrolet</option>
        </select>
        <select id="modelo"><option value="">Modelo</option></select>
        <input type="number" id="km-atual" placeholder="KM Atual do Painel">
        <p style="font-size: 12px; color: #94a3b8">Sugeriremos as manutenções principais. Você poderá ajustar as datas a seguir.</p>
        <button class="btn-futuristic" onclick="addCar()">Ativar Veículo</button>
    </div>

    <div id="screen-main" class="hidden">
        <div class="header-main">
            <small id="display-car-name" style="text-transform: uppercase; letter-spacing: 2px; color: var(--accent)"></small>
            <div class="km-badge-large" id="display-km">0 KM</div>
            <div style="color: var(--success); font-size: 12px;"><i class="fas fa-check-circle"></i> Sistemas Normais</div>
        </div>

        <div class="content p-20" style="padding: 20px;">
            <div id="tab-dash" class="tab-content">
                <h3>Resumo de Saúde</h3>
                <div id="dash-alerts"></div>
            </div>

            <div id="tab-fuel" class="tab-content hidden">
                <h3>Abastecimento</h3>
                <div class="glass-card">
                    <input type="text" id="posto-nome" placeholder="Nome do Posto/Endereço">
                    <input type="number" id="posto-preco" placeholder="Preço por Litro">
                    <button class="btn-futuristic" style="padding:10px" onclick="saveFuel()">Registrar</button>
                </div>
                <div id="fuel-history"></div>
            </div>

            <div id="tab-parts" class="tab-content hidden">
                <h3>Catálogo Técnico</h3>
                <select id="filter-parts" onchange="renderCatalog()">
                    <option value="Todos">Todos os Sistemas</option>
                    <option value="Motor">Motor</option>
                    <option value="Suspensão">Suspensão</option>
                    <option value="Freios">Freios</option>
                </select>
                <div id="catalog-list"></div>
            </div>

            <div id="tab-shop" class="tab-content hidden">
                <h3>Próximas Compras</h3>
                <div id="shopping-list"></div>
            </div>

            <div id="tab-config" class="tab-content hidden">
                <h3>Hardware & Cloud</h3>
                <button class="btn-futuristic" style="background:#6200ea" onclick="connectOBD()"><i class="fab fa-bluetooth"></i> Linkar ELM327 OBD2</button>
                <button class="btn-futuristic" style="background:var(--danger); margin-top:10px" onclick="deleteCurrentCar()">Remover Este Veículo</button>
            </div>
        </div>

        <nav class="bottom-dock">
            <div class="dock-item active" onclick="switchTab('dash', this)"><i class="fas fa-th-large"></i></div>
            <div class="dock-item" onclick="switchTab('fuel', this)"><i class="fas fa-gas-pump"></i></div>
            <div class="dock-item" onclick="switchTab('parts', this)"><i class="fas fa-tools"></i></div>
            <div class="dock-item" onclick="switchTab('shop', this)"><i class="fas fa-shopping-cart"></i></div>
            <div class="dock-item" onclick="switchTab('config', this)"><i class="fas fa-microchip"></i></div>
        </nav>
    </div>
</div>

<script>
// BANCO DE DADOS DE PEÇAS E MODELOS
const vehicleDB = {
    "volkswagen": { "Gol 1.6 MSI": [
        {id:'ol1', cat:'Motor', item:'Óleo 5W40', km:10000, cod:'VW508', ml:'oleo 5w40 gol msi'},
        {id:'cd1', cat:'Motor', item:'Correia Dentada', km:60000, cod:'04E109', ml:'kit correia msi'}
    ]}
};

let garage = JSON.parse(localStorage.getItem('garage_v3')) || [];
let currentCarIndex = null;

function showScreen(id) {
    document.querySelectorAll('.container > div').forEach(s => s.classList.add('hidden'));
    document.getElementById(id).classList.remove('hidden');
    if(id === 'screen-selector') renderGarage();
}

function loadModels() {
    const m = document.getElementById('marca').value;
    const s = document.getElementById('modelo');
    s.innerHTML = '';
    if(vehicleDB[m]) Object.keys(vehicleDB[m]).forEach(mod => s.innerHTML += `<option value="${mod}">${mod}</option>`);
}

function addCar() {
    const m = document.getElementById('marca').value;
    const mod = document.getElementById('modelo').value;
    const km = parseInt(document.getElementById('km-atual').value);
    
    if(!m || !mod || isNaN(km)) return alert("Dados incompletos");

    const newCar = {
        marca: m, modelo: mod, km: km, 
        pecas: vehicleDB[m][mod].map(p => ({...p, ultimaTroca: km})),
        abastecimentos: []
    };
    
    garage.push(newCar);
    localStorage.setItem('garage_v3', JSON.stringify(garage));
    showScreen('screen-selector');
}

function renderGarage() {
    const list = document.getElementById('car-list');
    list.innerHTML = '';
    garage.forEach((car, index) => {
        list.innerHTML += `
            <div class="glass-card neon-border" onclick="enterCar(${index})">
                <div style="font-size:12px; color:var(--accent)">${car.marca}</div>
                <div style="font-size:18px; font-weight:bold">${car.modelo}</div>
                <div style="color:#94a3b8">${car.km.toLocaleString()} KM</div>
            </div>`;
    });
}

function enterCar(index) {
    currentCarIndex = index;
    const car = garage[index];
    document.getElementById('display-car-name').innerText = car.modelo;
    document.getElementById('display-km').innerText = car.km.toLocaleString() + " KM";
    showScreen('screen-main');
    renderDash();
}

function renderCatalog() {
    const car = garage[currentCarIndex];
    const catFiltro = document.getElementById('filter-parts').value;
    const list = document.getElementById('catalog-list');
    list.innerHTML = '';

    car.pecas.filter(p => catFiltro === "Todos" || p.cat === catFiltro).forEach(p => {
        const perc = Math.max(0, 100 - ((car.km - p.ultimaTroca) / p.km * 100));
        list.innerHTML += `
            <div class="glass-card">
                <div style="display:flex; justify-content:space-between">
                    <b>${p.item}</b>
                    <small style="color:var(--neon)">${p.cod}</small>
                </div>
                <div class="progress-container"><div class="progress-fill" style="width:${perc}%; background:var(--neon)"></div></div>
                <a href="https://lista.mercadolivre.com.br/${p.ml}" target="_blank" style="color:var(--accent); font-size:12px; text-decoration:none">Ver no Mercado Livre →</a>
            </div>`;
    });
}

function switchTab(tab, el) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
    document.querySelectorAll('.dock-item').forEach(i => i.classList.remove('active'));
    document.getElementById('tab-'+tab).classList.remove('hidden');
    el.classList.add('active');
    if(tab === 'parts') renderCatalog();
    if(tab === 'shop') renderShop();
}

function renderShop() {
    const car = garage[currentCarIndex];
    const list = document.getElementById('shopping-list');
    list.innerHTML = '<h4>Combos Recomendados</h4>';
    
    // Simulação de lógica de combo
    list.innerHTML += `
        <div class="glass-card" style="border: 1px solid var(--success)">
            <div class="badge" style="background:var(--success); color:white; padding:2px 8px; border-radius:10px; font-size:10px">COMBO REVISÃO</div>
            <p>Kit Óleo 5W40 + Filtros</p>
            <div style="font-size:20px; font-weight:bold; color:var(--success)">R$ 289,90</div>
            <small>12x de R$ 24,15 s/ juros</small>
            <button class="btn-futuristic" style="margin-top:10px; padding:10px">Comprar no Mercado Livre</button>
        </div>`;
}

// Inicialização
if(garage.length > 0) showScreen('screen-selector');
else showScreen('screen-setup');

function deleteCurrentCar() {
    if(confirm("Excluir este veículo?")) {
        garage.splice(currentCarIndex, 1);
        localStorage.setItem('garage_v3', JSON.stringify(garage));
        location.reload();
    }
}
</script>
</body>
</html>
